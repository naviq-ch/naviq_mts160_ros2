name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  colcon:
    name: ROS 2 Jazzy build and test
    runs-on: ubuntu-24.04
    # Prebuilt image with ROS 2 Jazzy (ros-base), colcon, rosdep and vcs: installing ROS from apt on
    # every run proved unreliable on the hosted runners. The SocketCAN replay test needs a vcan0
    # interface, which a container cannot create; it is skipped here and runs on a Linux host with vcan0.
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-ros-jazzy-ros-base-latest
    steps:
      - name: Python dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-pip python3-msgpack python3-pytest-timeout can-utils
          python3 -m pip install --break-system-packages "python-can>=4.4" gs_usb

      - uses: ros-tooling/action-ros-ci@v0.3
        with:
          package-name: naviq_msgs naviq_mts160
          target-ros2-distro: jazzy
          import-token: ${{ secrets.GITHUB_TOKEN }}     # the repository is private
          no-symlink-install: true                     # regular install: the console script needs the package metadata
          skip-tests: false
          colcon-defaults: |
            {
              "test": {
                "event-handlers": ["console_cohesion+", "console_direct+"],
                "pytest-args": ["-x", "--timeout=180"]
              }
            }

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: ros_ws/log
          if-no-files-found: ignore

  tools-lint:
    name: Lint fixture tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install flake8 numpy pyyaml pyserial "python-can>=4.4" pytest
      - run: flake8 naviq_mts160/naviq_mts160 naviq_mts160/test tools/naviq_mts160_fixture
      - name: Decoder unit tests without ROS
        run: |
          cd naviq_mts160
          python -m pytest -q test/test_decoder.py test/test_sdo.py test/test_canbus.py
